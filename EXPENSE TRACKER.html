<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Expense Tracker</title>

  <!-- React libraries -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6fb;
      color: #202438;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #172554, #4f46e5);
    }

    .auth-card {
      background: white;
      padding: 35px;
      width: 100%;
      max-width: 410px;
      border-radius: 18px;
      box-shadow: 0 15px 40px #0003;
    }

    .auth-card h1 {
      text-align: center;
      color: #4f46e5;
      margin-bottom: 8px;
    }

    .auth-card p {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .auth-card input {
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .primary-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .primary-btn:hover {
      background: #3730a3;
    }

    .auth-card .primary-btn {
      width: 100%;
      margin-top: 12px;
    }

    .switch-auth {
      margin-top: 18px;
      text-align: center;
      color: #4f46e5;
      cursor: pointer;
    }

    .error {
      color: #dc2626;
      font-size: 13px;
      margin-top: 8px;
    }

    .app {
      min-height: 100vh;
    }

    header {
      background: #fff;
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px #0000000b;
      gap: 15px;
    }

    header h2 {
      color: #4f46e5;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logout-btn {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 30px 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome p {
      color: #777;
      margin-top: 6px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .summary-card {
      padding: 23px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 3px 12px #00000008;
    }

    .summary-card p {
      color: #777;
      margin-bottom: 12px;
    }

    .summary-card h2 {
      font-size: 27px;
    }

    .income {
      color: #16a34a;
    }

    .expense {
      color: #dc2626;
    }

    .balance {
      color: #4f46e5;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 22px;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000008;
      margin-bottom: 22px;
    }

    .panel h3 {
      margin-bottom: 18px;
    }

    .transaction-form {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .transaction-form input,
    .transaction-form select,
    .filters input,
    .filters select,
    .budget-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      min-width: 0;
    }

    .transaction-form button {
      grid-column: 1 / -1;
    }

    .progress-track {
      background: #e5e7eb;
      height: 12px;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-fill {
      height: 100%;
      background: #4f46e5;
      border-radius: 20px;
      transition: width .3s;
    }

    .progress-fill.warning {
      background: #f59e0b;
    }

    .progress-fill.danger {
      background: #dc2626;
    }

    .budget-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .budget-row input {
      flex: 1;
      min-width: 0;
    }

    .goal-info {
      color: #666;
      margin-top: 8px;
      font-size: 14px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .filters input {
      flex: 2;
      min-width: 160px;
    }

    .filters select {
      flex: 1;
      min-width: 130px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid #eee;
    }

    th {
      color: #777;
      font-size: 13px;
    }

    .type-tag {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .type-income {
      color: #15803d;
      background: #dcfce7;
    }

    .type-expense {
      color: #b91c1c;
      background: #fee2e2;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
    }

    .insight {
      padding: 13px;
      border-radius: 9px;
      background: #eef2ff;
      margin: 10px 0;
      color: #3730a3;
      line-height: 1.5;
    }

    .chart-container {
      height: 260px;
      position: relative;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #888;
    }

    footer {
      text-align: center;
      color: #888;
      padding: 25px;
    }

    @media (max-width: 750px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .section-grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 15px;
      }

      .container {
        padding: 20px 14px;
      }
    }

    @media (max-width: 450px) {
      .transaction-form {
        grid-template-columns: 1fr;
      }

      .transaction-form button {
        grid-column: auto;
      }

      .header-right {
        gap: 8px;
      }

      .header-right span {
        display: none;
      }

      .budget-row {
        flex-direction: column;
      }

      .auth-card {
        padding: 25px;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const categories = [
      "Food",
      "Transport",
      "Shopping",
      "Education",
      "Entertainment",
      "Health",
      "Bills",
      "Salary",
      "Freelance",
      "Other"
    ];

    const money = (value) =>
      "₹" + Number(value || 0).toLocaleString("en-IN", {
        maximumFractionDigits: 2
      });

    function ChartView({ type, data, labels, title }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;

        if (chartRef.current) {
          chartRef.current.destroy();
        }

        chartRef.current = new Chart(canvasRef.current, {
          type,
          data: {
            labels,
            datasets: [{
              label: title,
              data,
              backgroundColor: type === "doughnut"
                ? [
                    "#4f46e5", "#16a34a", "#f59e0b",
                    "#ef4444", "#06b6d4", "#8b5cf6",
                    "#ec4899", "#64748b", "#14b8a6"
                  ]
                : ["#4f46e5", "#16a34a"],
              borderRadius: type === "bar" ? 6 : 0,
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: type === "doughnut",
                position: "bottom"
              }
            },
            scales: type === "bar" ? {
              y: {
                beginAtZero: true
              }
            } : {}
          }
        });

        return () => {
          if (chartRef.current) {
            chartRef.current.destroy();
            chartRef.current = null;
          }
        };
      }, [type, JSON.stringify(data), JSON.stringify(labels)]);

      return (
        <div className="chart-container">
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

    function AuthPage({ onLogin }) {
      const [register, setRegister] = useState(false);
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");

      function submit(e) {
        e.preventDefault();
        setError("");

        const users = JSON.parse(localStorage.getItem("expense_users") || "{}");
        const key = email.trim().toLowerCase();

        if (!key || !password) {
          setError("Please enter your email and password.");
          return;
        }

        if (register) {
          if (!name.trim()) {
            setError("Please enter your name.");
            return;
          }

          if (password.length < 6) {
            setError("Password must contain at least 6 characters.");
            return;
          }

          if (users[key]) {
            setError("An account with this email already exists.");
            return;
          }

          users[key] = {
            name: name.trim(),
            password
          };

          localStorage.setItem("expense_users", JSON.stringify(users));
          onLogin({ email: key, name: name.trim() });
        } else {
          if (!users[key] || users[key].password !== password) {
            setError("Invalid email or password.");
            return;
          }

          onLogin({ email: key, name: users[key].name });
        }
      }

      return (
        <div className="auth-page">
          <div className="auth-card">
            <h1>Expense Tracker</h1>
            <p>{register ? "Create your account" : "Welcome back! Login to continue."}</p>

            <form onSubmit={submit}>
              {register && (
                <input
                  placeholder="Full name"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  required
                />
              )}

              <input
                type="email"
                placeholder="Email address"
                value={email}
                onChange={e => setEmail(e.target.value)}
                required
              />

              <input
                type="password"
                placeholder="Password (minimum 6 characters)"
                value={password}
                onChange={e => setPassword(e.target.value)}
                required
              />

              {error && <div className="error">{error}</div>}

              <button className="primary-btn" type="submit">
                {register ? "Create Account" : "Login"}
              </button>
            </form>

            <div
              className="switch-auth"
              onClick={() => {
                setRegister(!register);
                setError("");
              }}
            >
              {register
                ? "Already have an account? Login"
                : "New user? Create an account"}
            </div>
          </div>
        </div>
      );
    }

    function Dashboard({ user, onLogout }) {
      const storageKey = "expense_data_" + user.email;

      const [transactions, setTransactions] = useState(() => {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        return saved.transactions || [];
      });

      const [budget, setBudget] = useState(() => {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        return saved.budget || 0;
      });

      const [goal, setGoal] = useState(() => {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        return saved.goal || 0;
      });

      const [form, setForm] = useState({
        title: "",
        amount: "",
        type: "expense",
        category: "Food",
        date: new Date().toISOString().slice(0, 10)
      });

      const [search, setSearch] = useState("");
      const [filterType, setFilterType] = useState("all");
      const [filterCategory, setFilterCategory] = useState("all");

      useEffect(() => {
        localStorage.setItem(storageKey, JSON.stringify({
          transactions,
          budget,
          goal
        }));
      }, [transactions, budget, goal, storageKey]);

      const income = transactions
        .filter(t => t.type === "income")
        .reduce((sum, t) => sum + Number(t.amount), 0);

      const expenses = transactions
        .filter(t => t.type === "expense")
        .reduce((sum, t) => sum + Number(t.amount), 0);

      const balance = income - expenses;

      const currentMonth = new Date().toISOString().slice(0, 7);

      const monthlyExpenses = transactions
        .filter(t => t.type === "expense" && t.date.startsWith(currentMonth))
        .reduce((sum, t) => sum + Number(t.amount), 0);

      const monthlyIncome = transactions
        .filter(t => t.type === "income" && t.date.startsWith(currentMonth))
        .reduce((sum, t) => sum + Number(t.amount), 0);

      const budgetPercent = budget > 0
        ? Math.min((monthlyExpenses / budget) * 100, 100)
        : 0;

      const savingsPercent = goal > 0
        ? Math.min((Math.max(balance, 0) / goal) * 100, 100)
        : 0;

      function addTransaction(e) {
        e.preventDefault();

        if (!form.title.trim() || Number(form.amount) <= 0) {
          alert("Enter a description and a valid amount.");
          return;
        }

        const newTransaction = {
          id: Date.now(),
          title: form.title.trim(),
          amount: Number(form.amount),
          type: form.type,
          category: form.category,
          date: form.date
        };

        setTransactions(prev => [newTransaction, ...prev]);

        setForm({
          title: "",
          amount: "",
          type: "expense",
          category: "Food",
          date: new Date().toISOString().slice(0, 10)
        });
      }

      function deleteTransaction(id) {
        if (window.confirm("Delete this transaction?")) {
          setTransactions(prev => prev.filter(t => t.id !== id));
        }
      }

      const filteredTransactions = transactions.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(search.toLowerCase());
        const matchesType = filterType === "all" || t.type === filterType;
        const matchesCategory = filterCategory === "all" || t.category === filterCategory;

        return matchesSearch && matchesType && matchesCategory;
      });

      const categoryTotals = {};

      transactions
        .filter(t => t.type === "expense")
        .forEach(t => {
          categoryTotals[t.category] =
            (categoryTotals[t.category] || 0) + Number(t.amount);
        });

      const categoryLabels = Object.keys(categoryTotals);
      const categoryValues = Object.values(categoryTotals);

      const monthlyLabels = [];
      const monthlyIncomeValues = [];
      const monthlyExpenseValues = [];

      for (let i = 5; i >= 0; i--) {
        const date = new Date();
        date.setDate(1);
        date.setMonth(date.getMonth() - i);

        const monthKey = date.toISOString().slice(0, 7);

        monthlyLabels.push(
          date.toLocaleString("en-IN", { month: "short" })
        );

        monthlyIncomeValues.push(
          transactions
            .filter(t => t.type === "income" && t.date.startsWith(monthKey))
            .reduce((sum, t) => sum + Number(t.amount), 0)
        );

        monthlyExpenseValues.push(
          transactions
            .filter(t => t.type === "expense" && t.date.startsWith(monthKey))
            .reduce((sum, t) => sum + Number(t.amount), 0)
        );
      }

      const insights = [];

      if (transactions.length === 0) {
        insights.push("Add your first transaction to start receiving spending insights.");
      } else {
        if (monthlyExpenses > budget) {
          insights.push("You have exceeded your monthly budget. Consider reducing non-essential spending.");
        } else if (budget > 0 && monthlyExpenses >= budget * 0.8) {
          insights.push("You have used more than 80% of your monthly budget. Spend carefully.");
        } else {
          insights.push("Your monthly spending is within your budget. Keep it up!");
        }

        if (balance < 0) {
          insights.push("Your expenses are greater than your income. Review your spending.");
        } else {
          insights.push("Your current balance is positive. Keep building your savings.");
        }

        const highestCategory = Object.entries(categoryTotals)
          .sort((a, b) => b[1] - a[1])[0];

        if (highestCategory) {
          insights.push(
            `Your highest spending category is ${highestCategory[0]} (${money(highestCategory[1])}).`
          );
        }
      }

      return (
        <div className="app">
          <header>
            <h2>Smart Expense Tracker</h2>
            <div className="header-right">
              <span>Welcome, {user.name}</span>
              <button className="logout-btn" onClick={onLogout}>Logout</button>
            </div>
          </header>

          <main className="container">
            <div className="welcome">
              <h2>Dashboard</h2>
              <p>Manage your income, expenses and savings in one place.</p>
            </div>

            <div className="summary-grid">
              <div className="summary-card">
                <p>Total Income</p>
                <h2 className="income">{money(income)}</h2>
              </div>

              <div className="summary-card">
                <p>Total Expenses</p>
                <h2 className="expense">{money(expenses)}</h2>
              </div>

              <div className="summary-card">
                <p>Available Balance</p>
                <h2 className="balance">{money(balance)}</h2>
              </div>
            </div>

            <div className="section-grid">
              <section className="panel">
                <h3>Add Transaction</h3>

                <form className="transaction-form" onSubmit={addTransaction}>
                  <input
                    placeholder="Description"
                    value={form.title}
                    onChange={e => setForm({...form, title: e.target.value})}
                    required
                  />

                  <input
                    type="number"
                    min="0.01"
                    step="0.01"
                    placeholder="Amount (₹)"
                    value={form.amount}
                    onChange={e => setForm({...form, amount: e.target.value})}
                    required
                  />

                  <select
                    value={form.type}
                    onChange={e => setForm({...form, type: e.target.value})}
                  >
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                  </select>

                  <select
                    value={form.category}
                    onChange={e => setForm({...form, category: e.target.value})}
                  >
                    {categories.map(c => <option key={c}>{c}</option>)}
                  </select>

                  <input
                    type="date"
                    value={form.date}
                    onChange={e => setForm({...form, date: e.target.value})}
                    required
                  />

                  <button className="primary-btn" type="submit">
                    + Add Transaction
                  </button>
                </form>
              </section>

              <section className="panel">
                <h3>Monthly Budget</h3>

                <p>Monthly spending: <strong>{money(monthlyExpenses)}</strong></p>
                <p>Budget limit: <strong>{money(budget)}</strong></p>

                <div className="progress-track">
                  <div
                    className={
                      "progress-fill " +
                      (budgetPercent >= 100 ? "danger" :
                       budgetPercent >= 80 ? "warning" : "")
                    }
                    style={{width: budgetPercent + "%"}}
                  ></div>
                </div>

                <p className="goal-info">
                  {budget > 0
                    ? `${Math.round(budgetPercent)}% of your budget used`
                    : "Set a budget to track your spending."}
                </p>

                <div className="budget-row">
                  <input
                    className="budget-input"
                    type="number"
                    min="0"
                    value={budget}
                    onChange={e => setBudget(Math.max(0, Number(e.target.value)))}
                    placeholder="Set monthly budget"
                  />
                </div>

                <hr style={{margin: "22px 0", border: "0", borderTop: "1px solid #eee"}} />

                <h3>Savings Goal</h3>
                <p>Current balance: <strong>{money(Math.max(balance, 0))}</strong></p>
                <p>Target: <strong>{money(goal)}</strong></p>

                <div className="progress-track">
                  <div
                    className="progress-fill"
                    style={{width: savingsPercent + "%", background: "#16a34a"}}
                  ></div>
                </div>

                <p className="goal-info">
                  {Math.round(savingsPercent)}% of your savings goal reached
                </p>

                <div className="budget-row">
                  <input
                    className="budget-input"
                    type="number"
                    min="0"
                    value={goal}
                    onChange={e => setGoal(Math.max(0, Number(e.target.value)))}
                    placeholder="Set savings goal"
                  />
                </div>
              </section>
            </div>

            <div className="section-grid">
              <section className="panel">
                <h3>Expense by Category</h3>
                {categoryLabels.length > 0 ? (
                  <ChartView
                    type="doughnut"
                    labels={categoryLabels}
                    data={categoryValues}
                    title="Expenses"
                  />
                ) : (
                  <div className="empty">No expense data available yet.</div>
                )}
              </section>

              <section className="panel">
                <h3>Monthly Income vs Expenses</h3>
                <div className="chart-container">
                  <canvas id="monthlyChart"></canvas>
                </div>
                <MonthlyChart
                  labels={monthlyLabels}
                  income={monthlyIncomeValues}
                  expenses={monthlyExpenseValues}
                />
              </section>
            </div>

            <section className="panel">
              <h3>Smart Insights</h3>
              {insights.map((item, index) => (
                <div className="insight" key={index}>💡 {item}</div>
              ))}
            </section>

            <section className="panel">
              <h3>Transaction History</h3>

              <div className="filters">
                <input
                  placeholder="Search transactions..."
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                />

                <select
                  value={filterType}
                  onChange={e => setFilterType(e.target.value)}
                >
                  <option value="all">All Types</option>
                  <option value="income">Income</option>
                  <option value="expense">Expense</option>
                </select>

                <select
                  value={filterCategory}
                  onChange={e => setFilterCategory(e.target.value)}
                >
                  <option value="all">All Categories</option>
                  {categories.map(c => <option key={c}>{c}</option>)}
                </select>
              </div>

              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Description</th>
                      <th>Category</th>
                      <th>Date</th>
                      <th>Type</th>
                      <th>Amount</th>
                      <th>Action</th>
                    </tr>
                  </thead>

                  <tbody>
                    {filteredTransactions.map(t => (
                      <tr key={t.id}>
                        <td>{t.title}</td>
                        <td>{t.category}</td>
                        <td>{t.date}</td>
                        <td>
                          <span className={
                            "type-tag " +
                            (t.type === "income" ? "type-income" : "type-expense")
                          }>
                            {t.type}
                          </span>
                        </td>
                        <td className={t.type === "income" ? "income" : "expense"}>
                          {money(t.amount)}
                        </td>
                        <td>
                          <button
                            className="delete-btn"
                            onClick={() => deleteTransaction(t.id)}
                          >
                            Delete
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {filteredTransactions.length === 0 && (
                  <div className="empty">No transactions found.</div>
                )}
              </div>
            </section>
          </main>

          <footer>
            Smart Expense Tracker | Built with React
          </footer>
        </div>
      );
    }

    function MonthlyChart({ labels, income, expenses }) {
      const chartRef = useRef(null);

      useEffect(() => {
        const canvas = document.getElementById("monthlyChart");
        if (!canvas || !window.Chart) return;

        if (chartRef.current) {
          chartRef.current.destroy();
        }

        chartRef.current = new Chart(canvas, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Income",
                data: income,
                backgroundColor: "#16a34a",
                borderRadius: 5
              },
              {
                label: "Expenses",
                data: expenses,
                backgroundColor: "#ef4444",
                borderRadius: 5
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });

        return () => {
          if (chartRef.current) {
            chartRef.current.destroy();
            chartRef.current = null;
          }
        };
      }, [JSON.stringify(labels), JSON.stringify(income), JSON.stringify(expenses)]);

      return null;
    }

    function App() {
      const [user, setUser] = useState(() => {
        return JSON.parse(sessionStorage.getItem("expense_session") || "null");
      });

      function login(userData) {
        sessionStorage.setItem("expense_session", JSON.stringify(userData));
        setUser(userData);
      }

      function logout() {
        sessionStorage.removeItem("expense_session");
        setUser(null);
      }

      return user
        ? <Dashboard user={user} onLogout={logout} />
        : <AuthPage onLogin={login} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
